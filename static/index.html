<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapTrack</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<section id="auth" hidden>
  <div class="card auth-card">
    <h1>📸 SnapTrack</h1>
    <p class="sub">Never miss a renewal, warranty or return window.</p>
    <div class="tabs">
      <button type="button" id="tab-login" class="tab on">Log in</button>
      <button type="button" id="tab-signup" class="tab">Sign up</button>
    </div>
    <form id="auth-form">
      <label>Email or phone number</label>
      <input id="ident" type="text" autocomplete="username" required placeholder="you@example.com or +919876543210">
      <label>Password</label>
      <input id="pw" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">
      <button id="auth-btn" type="submit" class="primary wide">Log in</button>
      <p id="auth-msg" class="err"></p>
    </form>
  </div>
</section>

<section id="app" hidden>
  <header>
    <h1>📸 SnapTrack</h1>
    <div class="row">
      <button id="add" class="primary">+ Add receipt</button>
      <button id="open-settings" class="ghost" title="Settings">⚙</button>
    </div>
    <input id="file" type="file" accept="image/*,application/pdf" capture="environment" multiple hidden>
  </header>
  <p id="msg" class="muted"></p>
  <div id="summary" class="summary"></div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search store, category, notes…">
    <select id="cat"><option value="">All categories</option></select>
    <label class="chk"><input id="onlydl" type="checkbox"> Has upcoming deadline</label>
  </div>
  <div id="grid" class="grid"></div>
  <p id="empty" class="muted center" hidden>No receipts yet. Tap “+ Add receipt” to upload your first one.</p>
</section>

<dialog id="detail"><div id="detail-body"></div></dialog>

<dialog id="settings">
  <div class="dlg-head"><h2>Settings</h2><button class="ghost" data-close="settings">✕</button></div>
  <p class="muted" id="who"></p>
  <label>Alert email</label>
  <input id="s-email" type="email" placeholder="where to send deadline alerts">
  <label>Phone push topic (free, via the ntfy app)</label>
  <input id="s-topic" type="text" placeholder="e.g. snaptrack-ravi-8f3k2x">
  <p class="muted small">Install the free <b>ntfy</b> app on your phone and subscribe to the same topic. Pick something hard to guess.</p>
  <div class="row">
    <button id="s-save" class="primary">Save</button>
    <button id="s-test" class="ghost">Send test alert</button>
    <button id="logout" class="ghost">Log out</button>
  </div>
  <p id="s-msg" class="muted"></p>
  <p id="s-status" class="muted small"></p>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
